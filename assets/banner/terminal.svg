<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1600"
    height="520"
    viewBox="0 0 1600 520"
>

<defs>

<!-- ===================================================== -->
<!-- COLORS -->
<!-- ===================================================== -->

<linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#111827"/>
</linearGradient>

<linearGradient id="accent" x1="0%" y1="0%" x2="100%">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#3B82F6"/>
</linearGradient>

<linearGradient id="tabActive" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#1F2937"/>
    <stop offset="100%" stop-color="#242D3C"/>
</linearGradient>

<!-- ===================================================== -->
<!-- SHADOW -->
<!-- ===================================================== -->

<filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="10"
        flood-color="#000"
        flood-opacity="0.45"/>
</filter>

<filter id="glow">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

<!-- ===================================================== -->
<!-- STYLES -->
<!-- ===================================================== -->

<style>

.bg{
fill:url(#background);
}

.window{
fill:#161B22;
stroke:url(#accent);
stroke-width:2;
}

.sidebar{
fill:#11161D;
}

.activity{
fill:#0C1016;
}

.tab{
fill:#202833;
}

.active{
fill:url(#tabActive);
}

.divider{
stroke:#30363D;
stroke-width:1;
}

.title{
fill:#8B949E;
font-size:17px;
font-family:Consolas,Fira Code,monospace;
}

.tree{
fill:#8B949E;
font-size:17px;
font-family:Consolas,Fira Code,monospace;
}

.command{
fill:#3FB950;
font-size:24px;
font-family:Consolas,Fira Code,monospace;
}

.value{
fill:#F8FAFC;
font-size:31px;
font-family:Consolas,Fira Code,monospace;
}

.hero{
fill:url(#accent);
font-size:56px;
font-weight:bold;
font-family:Consolas,Fira Code,monospace;
}

</style>

</defs>

<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect
width="1600"
height="520"
class="bg"/>

<!-- ===================================================== -->
<!-- MAIN WINDOW -->
<!-- ===================================================== -->

<rect
x="45"
y="28"
width="1510"
height="460"
rx="18"
class="window"
filter="url(#shadow)"/>

<!-- ===================================================== -->
<!-- TITLE BAR -->
<!-- ===================================================== -->

<rect
x="45"
y="28"
width="1510"
height="52"
rx="18"
fill="#161B22"/>

<circle cx="75" cy="54" r="7" fill="#FF5F56"/>
<circle cx="100" cy="54" r="7" fill="#FFBD2E"/>
<circle cx="125" cy="54" r="7" fill="#27C93F"/>

<!-- ===================================================== -->
<!-- ACTIVITY BAR -->
<!-- ===================================================== -->

<rect
x="45"
y="80"
width="58"
height="408"
class="activity"/>

<text x="66" y="120" class="title">≡</text>
<text x="66" y="165" class="title">📁</text>
<text x="66" y="210" class="title">🔍</text>
<text x="66" y="255" class="title">⑂</text>
<text x="66" y="300" class="title">⚙</text>

<!-- ===================================================== -->
<!-- EXPLORER -->
<!-- ===================================================== -->

<rect
x="103"
y="80"
width="250"
height="408"
class="sidebar"/>

<text
x="125"
y="112"
class="title">
EXPLORER
</text>

<line
x1="103"
y1="125"
x2="353"
y2="125"
class="divider"/>

<text x="125" y="160" class="tree">📁 assets</text>
<text x="145" y="188" class="tree">📁 banner</text>
<text x="165" y="216" class="tree">📄 terminal.svg</text>

<text x="125" y="260" class="tree">📁 content</text>
<text x="145" y="288" class="tree">📄 01-about.md</text>
<text x="145" y="316" class="tree">📄 02-tech-stack.md</text>
<text x="145" y="344" class="tree">📄 04-projects.md</text>

<text x="125" y="390" class="tree">📄 README.template.md</text>

<!-- ===================================================== -->
<!-- EDITOR HEADER -->
<!-- ===================================================== -->

<rect
x="353"
y="80"
width="1202"
height="42"
fill="#161B22"/>

<rect
x="365"
y="87"
width="150"
height="28"
rx="6"
class="tab"/>

<rect
x="520"
y="87"
width="165"
height="28"
rx="6"
class="active"/>

<text
x="388"
y="106"
class="title">
README.md
</text>

<text
x="548"
y="106"
class="title">
terminal.svg
</text>

<line
x1="353"
y1="122"
x2="1555"
y2="122"
class="divider"/>

<!-- ===================================================== -->
<!-- TERMINAL CONTENT STARTS HERE -->
<!-- ===================================================== -->